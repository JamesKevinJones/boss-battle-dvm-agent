name: Security Review

# Runs on every PR. This is a BACKSTOP, not the gate that matters — it fires
# after code is already pushed and a PR exists. The actual pre-push check is
# the local /security-review slash command (see commands/security-review.md),
# which Claude Code runs against the pending diff before a push happens at
# all. This workflow catches anything pushed by a path that skipped that step
# (a manual push, a different tool, a teammate).

permissions:
  pull-requests: write # needed to post findings as PR comments
  contents: read

on:
  pull_request:

jobs:
  # Without the CLAUDE_API_KEY secret the review cannot run, and it used to
  # fail every PR with a red X. A job-level `if:` cannot read `secrets`, so this
  # job turns "is the key set?" into an output. Fork PRs get no secrets either.
  key-check:
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$CLAUDE_API_KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Security review skipped::CLAUDE_API_KEY is not set for this repository, so CI reviewed nothing. Coverage for this PR is whatever the local /security-review command found before the push."
          fi

  security:
    needs: key-check
    # Skipped, not passed, when there is no key: a green check that scanned
    # nothing would look like coverage.
    if: needs.key-check.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # Pinned to a commit, not @main: this action runs with a repo token and
      # an API key, so upstream changes should arrive by an explicit bump.
      # 0c6a49f = main as of 2026-02-11 (the repo publishes no release tags).
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          # Pinned explicitly. Left blank, this action's own default falls
          # back to a dated 2025 snapshot (claude-opus-4-1-20250805) rather
          # than picking up whatever is current — pin to the model you
          # actually want reviewing your diffs, and revisit this when a
          # newer one ships.
          #
          # 2026-10-07: claude-opus-5 -> claude-opus-5-5 (current Opus, cheaper).
          # Checked against the action's source: it sends only model,
          # max_tokens, messages and system, and keeps only blocks with
          # `.text`, so Opus 5.5's always-on thinking and its 400s on
          # disabled thinking / forced tool_choice don't affect it.
          # Known upstream issue, not fixable here: the action's
          # validate_api_access() pings the retired claude-3-5-haiku-20241022,
          # fails, and silently turns off its false-positive filter, so
          # expect noisier PR comments until Anthropic fixes it.
          claude-model: claude-opus-5-5
